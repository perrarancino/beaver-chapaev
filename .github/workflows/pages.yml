name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz -O /tmp/templates.zip
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.7.stable/
      - name: Import resources
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --editor --import --quit
      - name: Export web game
        run: |
          mkdir -p build/web
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --export-release Web build/web/index.html
      - name: Check exported game startup
        shell: bash
        run: |
          pack="$PWD/build/web/index.pck"
          cd "$(mktemp -d)"
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --main-pack "$pack" --quit-after 10 2>&1 | tee startup.log
          if grep -q 'SCRIPT ERROR:' startup.log; then
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
